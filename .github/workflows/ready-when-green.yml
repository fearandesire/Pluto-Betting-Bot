name: ready-when-green

# Fires after any listed workflow finishes; the reusable workflow re-checks the whole
# check set, so the last workflow to finish is the one that flips the PR to ready.
on:
  workflow_run:
    workflows:
      [
        "CodeQL",
        "Dependabot Updates",
        "Dependabot auto-merge",
        "Release",
        "CI/CD Pipeline",
        "Copilot cloud agent",
        "Copilot code review",
        "Khronos client update",
        "PR Title",
        "Auto-merge release PRs",
        "Pullfrog",
      ]
    types: [completed]

# A newer completion for the same branch supersedes an in-flight run only when
# the triggering workflow was a pull request. Push and release completions are
# not cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.workflow_run.head_branch || github.run_id }}
  cancel-in-progress: ${{ github.event.workflow_run.event == 'pull_request' || github.event.workflow_run.event == 'pull_request_target' }}

jobs:
  ready:
    # timeout-minutes is not valid on a job that calls a reusable workflow.
    # The called job in ci-shared finishes in about 10 seconds.
    permissions:
      contents: write
      pull-requests: write
      checks: read
      statuses: read
    uses: fearandesire/ci-shared/.github/workflows/ready-when-green.yml@v1
    secrets: inherit
