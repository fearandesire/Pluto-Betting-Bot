# Batched releases
#
# release-please (in release.yml) keeps ONE open `release-please--*` PR that
# accumulates every releasable commit merged to main and holds the version bump
# and CHANGELOG. Merging that PR publishes the GitHub release, and the release
# event triggers Deploy (image to GHCR, then Watchtower adopts `latest`).
#
# So merging feature work to main does NOT ship it. This workflow arms squash
# auto-merge on the release PR only after a human applies `release-ready`:
#
#   label `release-ready`  -> arm auto-merge (merges once `Verify` is green)
#   label `hold`           -> disarm
#   new commits on the PR  -> label removed and disarmed (release-please pushed
#                             more work into the batch; re-approve it)
#
# Critical fixes use the same path: label the open release PR right away.
# Policy: release/release-policy.md in the project files.
#
# Everything merged to main must therefore be safe to ship at any time: new
# behaviour behind a default-off flag, additive migrations only.

name: Auto-merge release PRs

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
    branches: [main]

permissions:
  contents: read
  pull-requests: write
  issues: write

# A newer event supersedes a running one, so a stale approval run cannot arm
# after the label was removed, `hold` was set or the head moved. The script
# also re-reads live state before it writes.
concurrency:
  group: release-batch-gate-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  READY_LABEL: release-ready
  HOLD_LABEL: hold

jobs:
  auto-merge:
    name: Arm release batch when labeled
    runs-on: ubuntu-latest
    if: >-
      startsWith(github.head_ref, 'release-please--') &&
      github.event.pull_request.head.repo.full_name == github.repository
    steps:
      # The App token (not GITHUB_TOKEN) arms the merge: a merge made with the
      # default token would not fire the push/release workflows downstream.
      - name: Mint App token
        uses: actions/create-github-app-token@v3
        id: app
        with:
          app-id: ${{ secrets.CASCADE_APP_ID }}
          private-key: ${{ secrets.CASCADE_APP_PRIVATE_KEY }}
          owner: fearandesire
          repositories: Pluto-Betting-Bot

      - name: Ensure the release-ready label exists
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh label create "$READY_LABEL" --repo "$GITHUB_REPOSITORY" \
            --color 0e8a16 \
            --description "Cut this release batch: the open release PR merges once Verify is green" \
            2>/dev/null || true

      - name: Arm or disarm auto-merge
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          ACTION: ${{ github.event.action }}
          # The head this event saw. Approval is only valid for this commit.
          EVENT_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          pr="repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER"
          disarm() { gh pr merge "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --disable-auto 2>/dev/null || true; }

          # Refresh mutable state immediately before writing; event labels can be stale.
          live=$(gh api "$pr")
          state=$(jq -r .state <<<"$live")
          live_head=$(jq -r .head.sha <<<"$live")
          ready=$(jq -r --arg l "$READY_LABEL" '[.labels[].name] | index($l) != null' <<<"$live")
          held=$(jq -r --arg l "$HOLD_LABEL" '[.labels[].name] | index($l) != null' <<<"$live")

          if [ "$ACTION" = synchronize ]; then
            # The batch changed after it was approved. Withdraw the approval.
            if [ "$ready" = true ]; then
              gh pr edit "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --remove-label "$READY_LABEL" || true
            fi
            disarm
            echo "Batch changed; release-ready withdrawn. Re-apply it to cut this batch." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          if [ "$state" = open ] && [ "$ready" = true ] && [ "$held" != true ] && [ "$live_head" = "$EVENT_HEAD" ]; then
            gh pr merge "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --auto --squash --match-head-commit "$EVENT_HEAD"
            echo "Armed: this release batch merges when Verify is green." >> "$GITHUB_STEP_SUMMARY"
          else
            disarm
            echo "Not armed: needs release-ready on the current head, and no hold." >> "$GITHUB_STEP_SUMMARY"
          fi
