name: Dependabot auto-merge

# Use the trusted base-branch workflow for Dependabot PR metadata and the
# existing release-relay App token. Never check out or run code from the PR.
on:
  pull_request_target:
    types: [opened, reopened, synchronize, labeled]

permissions:
  contents: read
  pull-requests: read

jobs:
  dependabot-auto-merge:
    runs-on: ubuntu-latest
    if: >-
      github.event.pull_request.user.login == 'dependabot[bot]' &&
      github.repository == 'fearandesire/Pluto-Betting-Bot' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      !github.event.pull_request.draft
    steps:
      - name: Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@v3.1.0
        with:
          github-token: ${{ github.token }}

      - name: Mint GitHub App token (Pluto-Betting-Bot)
        if: >-
          contains(github.event.pull_request.labels.*.name, 'dependencies') &&
          (steps.metadata.outputs.update-type == 'version-update:semver-patch' ||
           steps.metadata.outputs.update-type == 'version-update:semver-minor')
        uses: actions/create-github-app-token@v3
        id: app
        with:
          app-id: ${{ secrets.CASCADE_APP_ID }}
          private-key: ${{ secrets.CASCADE_APP_PRIVATE_KEY }}
          owner: fearandesire
          repositories: Pluto-Betting-Bot

      - name: Enable auto-merge for compatible Dependabot PRs
        if: steps.app.outcome == 'success'
        run: gh pr merge --auto --squash --match-head-commit "$PR_HEAD_SHA" "$PR_URL"
        env:
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ steps.app.outputs.token }}
