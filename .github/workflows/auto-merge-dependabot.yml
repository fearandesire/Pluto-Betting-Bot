name: Dependabot auto-merge

# pull_request_target is intentional: Dependabot-authored pull_request runs get a
# restricted secret context (Actions secrets withheld). This job never checks out
# PR head — only mints an App token and calls gh pr merge by URL. Do not add an
# actions/checkout of the PR head without revisiting this security model.

on:
  pull_request_target:
    types: [opened, reopened, synchronize, labeled]

permissions:
  contents: write
  pull-requests: write

jobs:
  dependabot-auto-merge:
    runs-on: ubuntu-latest
    if: >-
      github.event.pull_request.user.login == 'dependabot[bot]' &&
      github.repository == 'fearandesire/Pluto-Betting-Bot' &&
      github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - name: Mint GitHub App token (Pluto-Betting-Bot)
        uses: actions/create-github-app-token@v3
        id: app
        with:
          app-id: ${{ secrets.CASCADE_APP_ID }}
          private-key: ${{ secrets.CASCADE_APP_PRIVATE_KEY }}
          owner: fearandesire
          repositories: Pluto-Betting-Bot

      - name: Enable auto-merge for Dependabot PRs
        if: contains(github.event.pull_request.labels.*.name, 'dependencies')
        run: gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ steps.app.outputs.token }}
