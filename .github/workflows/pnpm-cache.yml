name: Warm pnpm cache

# setup-node caches the pnpm store under an exact lockfile hash. A cache saved
# during pull_request is stored on refs/pull/N/merge and cannot be read by any
# other pull request. Recent Verify logs all say "pnpm cache is not found" and
# then upload ~210 MB at the end of the job.
#
# This workflow writes that same key on main, which pull requests are allowed
# to read. It is not a required check. The path filter only limits this job.
# ci-cd-deployment.yml still has no paths filter, so Verify still reports.

on:
  push:
    branches: [main]
    paths:
      - pnpm-lock.yaml
      - package.json
      - .github/workflows/pnpm-cache.yml

permissions:
  contents: read

# Push to main. One group per run so these never cancel each other.
concurrency:
  group: ${{ github.workflow }}-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  warm:
    name: Warm pnpm store
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
