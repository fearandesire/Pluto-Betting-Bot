name: Bug report
description: Describe a failure, how to reproduce it, and the evidence.
body:
  - type: dropdown
    id: surface
    attributes:
      label: Affected surface (required)
      options:
        - Web or mobile UI
        - Discord message or embed
        - API, CLI, or background job
        - Report, document, or template
        - Other
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: What happened? (required)
      description: State the observed behavior and what you expected in a few sentences.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction (required)
      description: Give the shortest steps, affected version or commit, and relevant environment. Say if you cannot reproduce it.
    validations:
      required: true
  - type: upload
    id: screenshots
    attributes:
      label: Screenshots (required for a visible problem)
      description: Attach the current failure, including Discord output. No after screenshot is expected before a fix exists. If unavailable, explain below.
    validations:
      required: false
      accept: ".png,.jpg,.jpeg,.gif,.webp,.svg"
  - type: textarea
    id: evidence
    attributes:
      label: Evidence note (required)
      description: Explain what the screenshots show. For a nonvisual problem, write N/A with a reason and relevant output. If a visible failure could not be captured, explain why.
    validations:
      required: true
  - type: textarea
    id: details
    attributes:
      label: Demo, logs, or workaround (optional)
      description: Prefer a short recording for multiple screens or a multi-step interaction; include screenshots too. Put long logs inside a details block and remove secrets or private data.
      placeholder: |
        <details>
        <summary>Diagnostic output</summary>

        Paste relevant output here.

        </details>
