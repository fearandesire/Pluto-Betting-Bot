name: Feature request
description: Describe the problem and the observable outcome you need.
body:
  - type: dropdown
    id: surface
    attributes:
      label: Affected surface (required)
      options:
        - Web or mobile UI
        - Discord message or embed
        - API, CLI, or background job
        - Report, document, or template
        - Other
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem (required)
      description: Who is affected, and what are they trying to do? Keep it to a few sentences.
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Desired outcome (required)
      description: Describe the behavior that would solve the problem and how we could check it.
    validations:
      required: true
  - type: upload
    id: references
    attributes:
      label: Current screenshots or references (optional)
      description: Show the existing problem or a labeled mockup if helpful. A proposal does not need screenshots of an unimplemented result.
    validations:
      required: false
      accept: ".png,.jpg,.jpeg,.gif,.webp,.svg"
  - type: textarea
    id: context
    attributes:
      label: Alternatives and context (optional)
      description: Add constraints, related work, or a short demo. Put long explanations inside a details block.
